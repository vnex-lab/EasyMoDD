name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and build tools
        run: python -m pip install --upgrade pip build twine

      - name: Install EasyMoDD
        run: python -m pip install -e ".[dev,security]"

      - name: Import smoke test
        run: python -c "import EasyModel, easymodd; from EasyModel import ApiRoute, ComponentRegistry, DiscreteEventSimulator, EventBus, TcpPortForwarder, WebPage, Workbench, create_app, create_passport, create_server, encrypt_file, pairwise_distances; from easymodd import MMapTextDataset, audit_corpus; hub=Workbench(); assert 'mlp' in hub.components.names('models'); print(EasyModel.__name__, easymodd.__name__, Workbench.__name__, EventBus.__name__, DiscreteEventSimulator.__name__, create_passport.__name__, MMapTextDataset.__name__, audit_corpus.__name__)"

      - name: Run subsystem and integration tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*
