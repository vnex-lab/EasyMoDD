[project]
name = "easymodd"
version = "0.1.0"
description = "A configurable, training-first numerical machine learning library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.6"]
data = ["pandas>=2.0", "pyarrow>=15.0", "scikit-learn>=1.4"]
dev = ["pytest>=8.0"]

[project.scripts]
easymodd = "easymodd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
