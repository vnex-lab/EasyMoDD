[project]
name = "easymodd"
version = "0.1.0"
description = "A configurable, training-first numerical machine learning library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vnex Lab" }]
maintainers = [{ name = "Vnex Lab" }]
keywords = ["machine-learning", "deep-learning", "numpy", "cuda", "training", "transformers"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/vnex-lab/EasyMoDD"
Repository = "https://github.com/vnex-lab/EasyMoDD"
Issues = "https://github.com/vnex-lab/EasyMoDD/issues"
Documentation = "https://github.com/vnex-lab/EasyMoDD#readme"
Support = "https://ko-fi.com/vnexlab"

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.6"]
data = ["pandas>=2.0", "pyarrow>=15.0", "scikit-learn>=1.4"]
dev = ["build>=1.2", "pytest>=8.0", "twine>=5.0"]

[project.scripts]
easymodd = "easymodd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easymodd = ["py.typed"]
